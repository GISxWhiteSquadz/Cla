  <!-- Centered Icon Group -->
  <!-- Box size 160x160 centered at x=176, y=130 -->
  <rect x="180" y="130" width="152" height="152" rx="20" ry="20" fill="none" stroke="#FFFFFF" stroke-width="15"/>
  
  <!-- Stylized "C" inside -->
